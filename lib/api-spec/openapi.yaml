openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bookings
    description: Booking request operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /bookings:
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a booking request
      description: Submit a Salesforce optimization review request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingBody"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CreateBookingBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        company:
          type: string
          minLength: 1
        requestType:
          type: string
          default: "Intro Call"
        timezone:
          type: string
          default: "America/Chicago"
        meetingType:
          type: string
          default: "Zoom"
        timeWindow1:
          type: string
          default: ""
        timeWindow2:
          type: string
          default: ""
        timeWindow3:
          type: string
          default: ""
        phone:
          type: ["string", "null"]
        notes:
          type: string
          minLength: 10
        website:
          type: ["string", "null"]
      required:
        - name
        - email
        - company
        - notes
    BookingResponse:
      type: object
      properties:
        success:
          type: boolean
        id:
          type: integer
        message:
          type: string
      required:
        - success
        - id
        - message
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message
